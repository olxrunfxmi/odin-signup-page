<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/style.css">
    <title>Document</title>
</head>

<body>
    <div class="page-wrapper">

        <section class="side-bar">
            <div class="odin-logo"><img
                    src="https://cdn.statically.io/gh/TheOdinProject/curriculum/5f37d43908ef92499e95a9b90fc3cc291a95014c/html_css/project-sign-up-form/odin-lined.png"
                    alt="odin logo">
                <span>Odin</span>
            </div>

            <p>Photo by <a href="">Halie West</a> on <a href="">Unsplash</a></p>
        </section>
        <section class="form-bar">
            <p class="info">This is not a real online service! You know you need something
                like this in your life to help you realize your deepest dreams.
                Sign up now to get started.
            </p>
            <p class="info">You know you want to.</p>
            <h3>Let's do this</h3>
            <form class="log-form" action="">
                <label for="first_name">
                    <span>First Name</span>
                    <input type="text" id="first_name" name="first_name">
                </label>
                <label for="last_name">
                    <span>Last Name</span>
                    <input type="text" id="last_name" name="last_name">
                </label>
                <label for="email">
                    <span>Email</span>
                    <input type="email" id="email" name="email">
                </label>
                <label for="phone_number">
                    <span>Phone Number</span>
                    <input type="tel" id="phone_number" name="phone_number">
                </label>
                <label for="password">
                    <span>Password</span>
                    <input type="password" id="password" name="password" required>
                </label>
                <label for="confirm_pass">
                    <span>Confirm Password</span>
                    <input type="password" id="confirm_pass" name="confirm_pass" required>
                </label>

                <div class="form-end-row">
                    <button type="submit" class="btn">Create Account</button>
                    <p>Already have an account <a href="" class="log-in">Log in</a></p>
                </div>

            </form>
        </section>
    </div>
</body>

</html>
